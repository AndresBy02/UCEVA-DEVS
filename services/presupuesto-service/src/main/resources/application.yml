server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: presupuesto-service
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/presupuesto-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/presupuesto-realm/protocol/openid-connect/certs}
