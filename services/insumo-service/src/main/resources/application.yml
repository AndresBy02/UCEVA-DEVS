server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: insumo-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      use-big-decimal-for-floats: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/presupuesto-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/presupuesto-realm/protocol/openid-connect/certs}

services:
  presupuesto:
    url: ${PRESUPUESTO_SERVICE_URL:http://localhost:8082}
